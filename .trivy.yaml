# Configuración oficial de Trivy para Condominio App (Estándar QA 11X)
# Excluye orquestadores exclusivos de QA efímero (que requieren SYS_PTRACE para py-spy,
# user: root para OWASP ZAP y docker.sock:ro para Pumba Chaos) del escaneo IaC de producción.
scan:
  skip-dirs:
    - mutants
    - backend/mutants
    - backend/.venv
    - fastapi/mutants
    - python/mutants
    - node_modules
    - frontend/node_modules
    - vue3/node_modules
    - react-frontend/node_modules
    - node-backend/node_modules
    - dist
    - frontend/dist
    - vue3/dist
    - react-frontend/dist
    - graphify-out
    - backend/graphify-out
    - frontend/graphify-out
  skip-files:
    - backend/docker-compose.qa.yml
    - frontend/docker-compose.qa.yml
    - python/docker-compose.qa.yml
    - fastapi/docker-compose.qa.yml
    - node-backend/docker-compose.qa.yml
    - vue3/docker-compose.qa.yml
    - react-frontend/docker-compose.qa.yml
    - bash-scripts/docker-compose.qa.yml
    - php/docker-compose.qa.yml
