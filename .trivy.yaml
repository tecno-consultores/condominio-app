# Configuración oficial de Trivy para Condominio App (Estándar QA 11X)
# Excluye exclusivamente directorios generados y orquestadores *.qa.yml (SYS_PTRACE/ZAP/Pumba en QA).
scan:
  skip-dirs:
    - mutants
    - backend/mutants
    - backend/.venv
    - node_modules
    - frontend/node_modules
    - dist
    - frontend/dist
    - artifacts
    - coverage_report
    - graphify-out
    - backend/graphify-out
    - frontend/graphify-out
  skip-files:
    - docker-compose.qa.yml
    - backend/docker-compose.qa.yml
    - frontend/docker-compose.qa.yml
