services:
  ui-prod:
    image: nginx:alpine
    container_name: condominio_ui_prod
    hostname: ui-prod
    pull_policy: if_not_present
    environment:
      TZ: 'America/Caracas'
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.qa.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-logs:/var/log/nginx
    ports:
      - "${UI_HOST_PORT:-0}:80"

  qa-vue3:
    image: sinfallas/base-node-ionic:26
    container_name: condominio_qa_frontend
    hostname: qa-vue3
    pull_policy: if_not_present
    environment:
      TZ: 'America/Caracas'
      PNPM_HOME: /pnpm
    volumes:
      - .:/app
      - pnpm-store:/pnpm
    working_dir: /app
    command: bash -c "echo 'Contenedor QA Vue 3 listo para Lint, Type-Check, Unit y Mutación'; sleep infinity"

  ui-e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-jammy
    container_name: condominio_ui_e2e
    hostname: ui-e2e
    pull_policy: if_not_present
    environment:
      TZ: 'America/Caracas'
      PNPM_HOME: /pnpm
    volumes:
      - .:/app
      - pnpm-store:/pnpm
    working_dir: /app
    command: bash -c "echo 'Contenedor E2E listo'; sleep infinity"

  chrome-cdp:
    image: mcr.microsoft.com/playwright:v1.64.1-jammy
    container_name: condominio_ui_chrome_cdp
    hostname: chrome-cdp
    pull_policy: if_not_present
    environment:
      TZ: 'America/Caracas'
    command: >
      bash -c "CHROME_SHELL=$$(find /ms-playwright -name chrome-headless-shell -type f | head -n 1); exec \"$$CHROME_SHELL\" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 about:blank"

  karatelabs:
    image: sinfallas/karatelabs:latest
    container_name: condominio_ui_karate
    pull_policy: if_not_present
    network_mode: "service:chrome-cdp"
    depends_on:
      - ui-prod
      - chrome-cdp
    environment:
      - UI_BASE_URL=http://ui-prod:80
      - CHROME_CDP_URL=http://127.0.0.1:9222
    volumes:
      - ./test:/app/src/test/java/examples/test
    command: bash -c "echo 'Contenedor Karate UI listo'; sleep infinity"

networks:
  default:
    driver: bridge

volumes:
  pnpm-store:
    name: condominio_frontend_pnpm_store
  nginx-logs:
    name: condominio_frontend_nginx_logs
