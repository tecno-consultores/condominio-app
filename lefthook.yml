# ==============================================================================
# LEFTHOOK - BARRERA DE ENTRADA (Pre-commit, Commit-msg & Pre-push)
# ==============================================================================
# Intercepta los comandos de Git y ejecuta validaciones efímeras en Docker ANTES
# de permitir que el código entre al historial o sea enviado al remoto.

pre-commit:
  parallel: true
  commands:
    # --------------------------------------------------------------------------
    # ECOSISTEMA PYTHON & FASTAPI
    # --------------------------------------------------------------------------
    python-lint:
      glob: "backend/**/*.py"
      run: docker compose -f backend/docker-compose.qa.yml run --rm qa-backend bash -c "uv sync -q && ruff check {staged_files} && ruff format --check {staged_files}"

    # --------------------------------------------------------------------------
    # ECOSISTEMA VUE 3 & TYPESCRIPT (Cuando exista frontend/)
    # --------------------------------------------------------------------------
    frontend-lint:
      glob: "frontend/**/*.{js,ts,vue}"
      run: docker run --rm -v "${PWD}/frontend:/app" -w /app sinfallas/base-node-ionic:26 sh -c "pnpm eslint --max-warnings 0 ."

    # --------------------------------------------------------------------------
    # PROTECCIÓN DE SECRETOS (Global)
    # --------------------------------------------------------------------------
    leaks-check:
      glob: "**/*"
      run: ./scripts/verificar-secretos.sh

commit-msg:
  commands:
    conventional-commits:
      run: docker run --rm -v "${PWD}:/repo" -w /repo sinfallas/base-node-ionic:26 sh -c "pnpm install --ignore-scripts --silent && ./node_modules/.bin/commitlint --edit {1}"

pre-push:
  commands:
    trivy-iac-scan:
      run: ./auditar-infra.sh
