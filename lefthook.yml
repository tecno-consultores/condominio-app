# LEFTHOOK - BARRERA DE ENTRADA (Pre-commit, Commit-msg & Pre-push)
# ==============================================================================
# Intercepta comandos Git y ejecuta validaciones efímeras en Docker (Rule Zero)
# antes de incorporar commits al historial o hacer push al remoto.

pre-commit:
  parallel: true
  commands:
    backend-lint:
      root: "backend/"
      glob: "*.py"
      run: docker compose -f docker-compose.qa.yml run --rm -u "$(id -u):$(id -g)" qa-backend bash -c "uv run ruff check {staged_files} && uv run ruff format --check {staged_files}"

    frontend-lint:
      root: "frontend/"
      glob: "*.{js,ts,vue}"
      run: docker compose -f docker-compose.qa.yml run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp qa-vue3 bash -c "[ -w /pnpm ] && export pnpm_config_store_dir=/pnpm || export pnpm_config_store_dir=/tmp/pnpm-store; pnpm install --silent && npx prettier --check {staged_files} && npx eslint {staged_files}"

    leaks-check:
      glob: "**/*"
      run: ./scripts/verificar-secretos.sh {staged_files}

commit-msg:
  commands:
    conventional-commits:
      run: bash -c 'first_line=$(head -n 1 "{1}"); printf "%s\n" "$first_line" | grep -Eq "^(Merge |Revert \"|(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_.,/-]+\))?!?: .+)" || { echo "❌ [Conventional Commits] Formato requerido: <tipo>(<alcance>): <descripción>" >&2; exit 1; }'

pre-push:
  commands:
    trivy-iac-scan:
      run: ./scripts/auditar-infra.sh
