# LEFTHOOK - BARRERA DE ENTRADA (Pre-commit, Commit-msg & Pre-push — Rule Zero)
# ==============================================================================

pre-commit:
  parallel: true
  commands:
    backend-lint:
      root: "backend/"
      glob: "*.py"
      run: docker compose -f docker-compose.qa.yml run --rm -T -u "$(id -u):$(id -g)" qa-backend bash -c "uv sync --frozen -q && uv run ruff check {staged_files} && uv run ruff format --check {staged_files}"

    frontend-lint:
      root: "frontend/"
      glob: "*.{js,ts,vue}"
      run: docker compose -f docker-compose.qa.yml run --rm -T -u "$(id -u):$(id -g)" -e HOME=/tmp qa-vue3 bash -c "[ -w /pnpm ] && export pnpm_config_store_dir=/pnpm || export pnpm_config_store_dir=/tmp/pnpm-store; pnpm install --frozen-lockfile --silent && npx prettier --check {staged_files} && npx eslint {staged_files}"

    leaks-check:
      glob: "**/*"
      run: ./scripts/verificar-secretos.sh {staged_files}

commit-msg:
  commands:
    conventional-commits:
      run: docker run --rm -i -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$(pwd):/repo:ro" -v "condominio_hooks_pnpm:/pnpm" -w /tmp sinfallas/base-node-ionic:26@sha256:275f3d8bbfef87f4e836e4f77d92c0d199821154079b050eaef53ce33ae6de60 bash -c 'mkdir -p /tmp/cl && cp /repo/package.json /repo/pnpm-lock.yaml /repo/commitlint.config.js /tmp/cl/ && cd /tmp/cl && pnpm_config_store_dir=/pnpm pnpm install --frozen-lockfile --ignore-scripts --silent && ./node_modules/.bin/commitlint --config /tmp/cl/commitlint.config.js' < "{1}"

pre-push:
  commands:
    trivy-iac-scan:
      run: ./scripts/auditar-infra.sh
