services:
  redis:
    image: eqalpha/keydb:alpine@sha256:f1d60f12cb3c933b169886657333a17018580c0fdbde5c3b3717e652e7af3f0a
    container_name: condominio_backend_redis
    hostname: redis
    pull_policy: if_not_present
    command: >
      keydb-server
      --server-threads 2
      --appendonly no
      --save ""
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
    networks:
      default:
        aliases:
          - keydb
          - condominio_backend_redis
    healthcheck:
      test: ["CMD-SHELL", "keydb-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
    container_name: condominio_backend_postgres
    hostname: postgres
    pull_policy: if_not_present
    restart: unless-stopped
    environment:
      POSTGRES_DB: qa_db
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: qa_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_user -d qa_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    image: sinfallas/base-python-uv:3.13@sha256:1594cbb33269c6a535a8ae5242b07a5866aa519d00975868f0a0d03fdc3bc155
    container_name: condominio_backend_api
    hostname: condominio_backend_api
    pull_policy: if_not_present
    environment:
      TZ: 'America/Caracas'
      HOME: /tmp
      UV_CACHE_DIR: /tmp/uv-cache
      UV_PROJECT_ENVIRONMENT: /tmp/uv-venv
      DATABASE_URL: 'sqlite+aiosqlite:////tmp/qa_api.db'
      REDIS_URL: 'redis://redis:6379/0'
      APP_ENV: 'qa_test'
      METRICS_AUTH_TOKEN: 'fake-qa-metrics-token-11x'
      BOOTSTRAP_ADMIN_CORREO: 'presidente.bootstrap@condominio.test'
      BOOTSTRAP_ADMIN_PASSWORD: '${BOOTSTRAP_ADMIN_PASSWORD:-fake-qa-bootstrap-123456!}'
      BOOTSTRAP_ADMIN_CEDULA: 'V-00000001'
      BOOTSTRAP_ADMIN_NOMBRE: 'Presidente Bootstrap QA'
      BOOTSTRAP_UNIDAD_INICIAL: 'QA-01'
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ${HOST_PWD:-.}:/app
    working_dir: /app
    ports:
      - "${API_HOST_PORT:-0}:8000"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    command: bash -c "rm -f /tmp/qa_api.db && uv sync --frozen --no-dev && uv run --no-dev python -m src.bootstrap --from-env && uv run --no-dev uvicorn src.main:app --host 0.0.0.0 --port 8000"

  qa-backend:
    image: sinfallas/base-python-uv:3.13@sha256:1594cbb33269c6a535a8ae5242b07a5866aa519d00975868f0a0d03fdc3bc155
    container_name: condominio_qa_backend
    hostname: condominio_qa_backend
    pull_policy: if_not_present
    environment:
      TZ: 'America/Caracas'
      HOME: /tmp
      UV_CACHE_DIR: /tmp/uv-cache
      UV_PROJECT_ENVIRONMENT: /tmp/uv-venv
      DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
      REDIS_URL: 'redis://redis:6379/0'
      APP_ENV: 'qa_unit'
    volumes:
      - ${HOST_PWD:-.}:/app
    working_dir: /app
    cap_add:
      - SYS_PTRACE
    command: bash -c "echo 'Contenedor QA Backend listo para Lint, Pytest y Mutmut'; sleep infinity"

  karatelabs:
    image: sinfallas/karatelabs@sha256:f0cb9342d141abc74935c45ffea277f9c0c58af768b1af5614b046d7ce0b6647
    container_name: condominio_backend_karate
    hostname: condominio_backend_karate
    pull_policy: if_not_present
    depends_on:
      - api
    volumes:
      - ${HOST_PWD:-.}/test:/app/src/test/java/examples/test
    command: bash -c "echo 'Contenedor Karate listo'; sleep infinity"

  zap:
    image: zaproxy/zap-stable@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
    container_name: condominio_backend_zap
    hostname: condominio_backend_zap
    pull_policy: if_not_present
    depends_on:
      - api
    user: root
    volumes:
      - ${HOST_PWD:-.}:/zap/wrk/:rw
    command: bash -c "echo 'Contenedor ZAP listo'; sleep infinity"

  pumba:
    image: gaiaadm/pumba:0.10.1
    container_name: condominio_backend_pumba
    hostname: condominio_backend_pumba
    profiles:
      - chaos
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - api
    command: netem --tc-image gaiadocker/iproute2:latest --duration 1m delay --time 500 --jitter 50 re2:^condominio_backend_api$

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: condominio_backend_prometheus
    hostname: condominio_backend_prometheus
    profiles:
      - chaos
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "
        global:
          scrape_interval: 2s
        scrape_configs:
          - job_name: 'condominio_backend'
            metrics_path: '/metrics'
            authorization:
              credentials: 'fake-qa-metrics-token-11x'
            static_configs:
              - targets: ['api:8000']
        " > /tmp/prometheus.yml
        /bin/prometheus --config.file=/tmp/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - api

  stress_test:
    image: sinfallas/base-python-uv:3.13@sha256:1594cbb33269c6a535a8ae5242b07a5866aa519d00975868f0a0d03fdc3bc155
    container_name: condominio_backend_chaos_locust
    hostname: condominio_backend_chaos_locust
    profiles:
      - chaos
    depends_on:
      - api
      - pumba
      - prometheus
    environment:
      HOME: /tmp
      UV_CACHE_DIR: /tmp/uv-cache
      UV_PROJECT_ENVIRONMENT: /tmp/uv-venv
      REDIS_URL: 'redis://redis:6379/0'
    volumes:
      - ${HOST_PWD:-.}:/app
    working_dir: /app
    command: bash -c "uv sync --frozen && echo 'Esperando API...' && sleep 5 && uv run locust -f tests/locustfile.py --headless -u 100 -r 10 -t 1m --host http://api:8000 --html chaos-report.html"

networks:
  default:
    driver: bridge
