services:
  redis:
    image: redis:7-alpine
    container_name: condominio_backend_redis
    hostname: condominio_backend_redis
    pull_policy: always
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    image: sinfallas/base-python-uv:3.13
    container_name: condominio_backend_api
    hostname: condominio_backend_api
    pull_policy: always
    environment:
      TZ: 'America/Caracas'
      UV_CACHE_DIR: /root/.cache/uv
      DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
      REDIS_URL: 'redis://redis:6379/0'
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ${HOST_PWD:-.}:/app
      - uv-cache:/root/.cache/uv
    working_dir: /app
    ports:
      - "8000:8000"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    command: bash -c "uv pip install --system -e '.[dev]' && uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"

  qa-backend:
    image: sinfallas/base-python-uv:3.13
    container_name: condominio_qa_backend
    hostname: condominio_qa_backend
    pull_policy: always
    environment:
      TZ: 'America/Caracas'
      UV_PYTHON_DOWNLOADS: 'true'
      UV_CACHE_DIR: /root/.cache/uv
      DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
      REDIS_URL: 'redis://redis:6379/0'
    volumes:
      - ${HOST_PWD:-.}:/app
      - uv-cache:/root/.cache/uv
    working_dir: /app
    cap_add:
      - SYS_PTRACE
    command: bash -c "echo 'Contenedor QA Backend listo para Lint, Pytest y Mutmut'; sleep infinity"

  karatelabs:
    image: sinfallas/karatelabs:latest
    container_name: condominio_backend_karate
    hostname: condominio_backend_karate
    pull_policy: always
    depends_on:
      - api
    volumes:
      - ${HOST_PWD:-.}/test:/app/src/test/java/examples/test
    command: bash -c "echo 'Contenedor Karate listo'; sleep infinity"

  zap:
    image: zaproxy/zap-stable:latest
    container_name: condominio_backend_zap
    hostname: condominio_backend_zap
    pull_policy: always
    depends_on:
      - api
    user: root
    volumes:
      - ${HOST_PWD:-.}:/zap/wrk/:rw
    command: bash -c "echo 'Contenedor ZAP listo'; sleep infinity"

  pumba:
    image: gaiaadm/pumba:latest
    container_name: condominio_backend_pumba
    hostname: condominio_backend_pumba
    profiles:
      - chaos
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - api
    command: netem --tc-image gaiadocker/iproute2 --duration 1m delay --time 500 --jitter 50 re2:^condominio_backend_api$

  prometheus:
    image: prom/prometheus:latest
    container_name: condominio_backend_prometheus
    hostname: condominio_backend_prometheus
    profiles:
      - chaos
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "
        global:
          scrape_interval: 2s
        scrape_configs:
          - job_name: 'condominio_backend'
            metrics_path: '/metrics'
            static_configs:
              - targets: ['api:8000']
        " > /tmp/prometheus.yml
        /bin/prometheus --config.file=/tmp/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - api

  stress_test:
    image: sinfallas/base-python-uv:3.13
    container_name: condominio_backend_chaos_locust
    hostname: condominio_backend_chaos_locust
    profiles:
      - chaos
    depends_on:
      - api
      - pumba
      - prometheus
    environment:
      UV_CACHE_DIR: /root/.cache/uv
      REDIS_URL: 'redis://redis:6379/0'
    volumes:
      - ${HOST_PWD:-.}:/app
      - uv-cache:/root/.cache/uv
    working_dir: /app
    command: bash -c "uv pip install --system -e '.[dev]' && echo 'Esperando API...' && sleep 5 && locust -f tests/locustfile.py --headless -u 100 -r 10 -t 1m --host http://api:8000 --html chaos-report.html"

  graphify:
    image: sinfallas/remote-graphify:latest
    container_name: condominio_backend_graphify
    hostname: condominio_backend_graphify
    profiles:
      - graphify
    restart: always
    command: uvx --from graphifyy python -m graphify.serve /app/graphify-out/graph.json --transport http --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - GRAPHIFY_OLLAMA_KEEP_ALIVE=10
    volumes:
      - ${HOST_PWD:-.}:/app
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

volumes:
  uv-cache:
    name: condominio_backend_uv_cache
