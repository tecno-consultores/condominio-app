[tox]
env_list = py313
isolated_build = True

[testenv]
description = QA Nivel 11X local: lint, tipado, SAST, gates de complejidad, auditoría de dependencias y cobertura
deps =
    .[dev]
commands =
    ruff check src/ tests/ scripts/ alembic/
    ruff format --check src/ tests/ scripts/ alembic/
    mypy .
    bandit -r src/
    radon cc src/ -s -nb
    radon mi src/ -s
    python scripts/radon_gates.py
    uv audit
    pytest --cov=src/ --cov-report=term-missing --cov-fail-under=95