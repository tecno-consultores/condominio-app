name: "Paso 2: QA Frontend Vue 3 Mobile-First Nivel 11X (efímero en Docker)"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  qa-frontend:
    name: 🧩 Huérfanos UI, Lint SonarJS, Unit >= 95%, E2E/A11y/Visual, Lighthouse y Karate UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: 🧩 Verificar Cero Componentes UI Huérfanos
        run: make qa-orphans

      - name: 🔍 Formato, Tipado y Complejidad Cognitiva (Prettier + vue-tsc + ESLint SonarJS ≤ 15)
        run: make qa-lint

      - name: 🧪 Pruebas Unitarias Vitest (Cobertura V8 ≥ 95%) + Build Vite
        run: make qa-unit

      - name: 🎭 Pruebas E2E Screenplay, Geometría Anti-JSDOM, Axe WCAG 2.1 AA y Regresión Visual
        run: make qa-e2e

      - name: ⚡ Auditoría de Rendimiento y Core Web Vitals (Lighthouse CI)
        run: make qa-perf

      - name: 📚 Pruebas BDD de Aceptación UI (Karate Labs + Chrome CDP)
        run: make qa-bdd

      - name: 🧹 Limpieza de contenedores QA
        if: always()
        run: make clean-cache
