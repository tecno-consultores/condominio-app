name: "Paso 0: Auditoría de Infraestructura (Trivy IaC)"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  trivy-iac-scan:
    name: 🛡️ Escaneo Estático de Contenedores y IaC
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: 🔍 Escaneo de Misconfiguraciones (Docker Compose / Scripts)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          hide-progress: false
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          skip-dirs: 'backend/.venv,frontend/node_modules,node_modules,dist,target,graphify-out'

      - name: 📦 Escaneo de Vulnerabilidades en Manifiestos (CVEs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          skip-dirs: 'backend/.venv,frontend/node_modules,node_modules,dist,target,graphify-out'
