name: "Paso 0: Auditoría de Infraestructura (Trivy IaC)"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  trivy-iac-scan:
    name: 🛡️ Escaneo Estático de Contenedores y IaC
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: 🔍 Escaneo de Misconfiguraciones (Docker Compose / Scripts)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          hide-progress: false
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          skip-dirs: 'backend/.venv'

      - name: 📦 Escaneo de Vulnerabilidades en Manifiestos (CVEs)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          skip-dirs: 'backend/.venv'