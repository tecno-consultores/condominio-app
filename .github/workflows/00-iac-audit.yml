name: "Paso 0: Auditoría de Infraestructura (Trivy IaC), Bash QA y Gobernanza 11X"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  trivy-iac-scan:
    name: 🛡️ Escaneo IaC/FS (Trivy), Scripts Bash y Gobernanza 11X
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🔍 Escaneo de Misconfiguraciones (Docker Compose / Scripts)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          hide-progress: false
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          skip-dirs: 'backend/.venv,frontend/node_modules,node_modules,dist,target,graphify-out'

      - name: 📦 Escaneo de Vulnerabilidades en Manifiestos (CVEs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          skip-dirs: 'backend/.venv,frontend/node_modules,node_modules,dist,target,graphify-out'

      - name: 🐚 QA Scripts Operativos Bash (shfmt + ShellCheck + BATS)
        run: make qa-bash

      - name: 🧭 Validadores Estáticos de Gobernanza 11X (Docker)
        run: |
          docker run --rm -u "$$(id -u):$$(id -g)" -v "$$(pwd):/workspace:ro" -w /workspace sinfallas/base-python-uv:3.13 bash -c "
            python3 .agents/scripts/verify_json_no_duplicate_keys.py &&
            python3 .agents/scripts/verify_zero_orphan_vue_components.py &&
            python3 .agents/scripts/verify_no_orphan_api_endpoints.py &&
            python3 .agents/scripts/verify_alembic_orm_parity.py &&
            python3 .agents/scripts/verify_roadmap_consistency.py &&
            python3 .agents/scripts/verify_docs_invariants.py
          "
