name: "Paso 0: Auditoría de Infraestructura (Trivy IaC), Bash QA y Gobernanza 11X"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  trivy-iac-scan:
    name: 🛡️ Escaneo IaC/FS (Trivy), Secretos, Bash kcov y Gobernanza 11X
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - name: 🔐 Escaneo global de secretos en árbol completo
        run: ./scripts/verificar-secretos.sh

      - name: 🔍 Escaneo de Misconfiguraciones (Docker Compose / Dockerfiles)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.35.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          hide-progress: false
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          skip-dirs: 'backend/.venv,frontend/node_modules,node_modules,dist,target,graphify-out,artifacts'

      - name: 📦 Escaneo de Vulnerabilidades en Manifiestos (CVEs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          skip-dirs: 'backend/.venv,frontend/node_modules,node_modules,dist,target,graphify-out,artifacts'

      - name: 🐚 QA Scripts Operativos Bash (shfmt + ShellCheck + BATS + kcov >= 95%)
        run: make qa-bash

      - name: 🏛️ Validar arquitectura FINOS CALM 1.2 y controles 11X
        run: ./.agents/scripts/validate_calm_architecture.sh

      - name: 🧭 Compuerta Integral de Certificación 10/10 (Rule Zero)
        run: ./.agents/scripts/certify_task_completion.sh --strict
